[project]
name = "liangdawang-plus-backend"
version = "0.1.0"
description = "粮达网 Plus 后端（FastAPI + MySQL）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "pydantic>=2.7",
    "pytest>=8.0",
    "httpx>=0.27",
    "langchain-openai>=1.6.0",
    "langgraph>=1.0",
    "python-dotenv>=1.2.3",
    "mem0ai>=1.0",
    "pymilvus>=2.6,<2.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
